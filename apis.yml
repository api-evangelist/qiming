aid: qiming
name: Qiming Venture Partners
description: >-
  Qiming Venture Partners is a leading China-based venture capital firm founded in 2006 by Duane Kuang
  and Gary Rieschel, headquartered in Shanghai with additional offices in Beijing, Suzhou, Hong Kong,
  Singapore, and a U.S. affiliate (Qiming Venture Partners USA) in Seattle, Washington. The firm invests
  at the early and growth stages, with roughly 70% of its investments concentrated in Series A and Series B
  rounds, across two core practice areas: Technology (mobile internet, consumer, AI, robotics,
  semiconductors, enterprise software, autonomous driving) and Healthcare (biotech, pharmaceuticals,
  medical devices, diagnostics, and digital health). Qiming manages 11 U.S. Dollar funds and 7 RMB funds
  with approximately $9.5 billion in capital raised, and has backed more than 580 companies, of which over
  210 have exited via IPO on the NYSE, NASDAQ, HKEX, Shanghai, or Shenzhen exchanges, or through M&A. It is
  an early backer of some of China's most influential technology companies, including Xiaomi, Meituan,
  Bilibili, Zhihu, Roborock, Hesai Technology, UBTech, WeRide, Insta360, and Zhipu AI (Z.ai), alongside a
  deep healthcare portfolio spanning Zai Lab, Gan & Lee Pharmaceuticals, CanSino Biologics, Tigermed, and
  Insilico Medicine.
